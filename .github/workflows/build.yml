name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build for all platforms'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      
      - name: Build Windows Portable
        working-directory: ./desktop
        run: npx electron-builder --win portable
      
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Filteradium-Windows
          path: desktop/dist/Filteradium*.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      
      - name: Build macOS
        working-directory: ./desktop
        run: npx electron-builder --mac dir
      
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Filteradium-macOS
          path: desktop/dist/mac*/
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      
      - name: Install dependencies
        working-directory: ./desktop
        run: npm ci
      
      - name: Build Linux AppImage
        working-directory: ./desktop
        run: npx electron-builder --linux AppImage
      
      - name: Build Linux DEB
        working-directory: ./desktop
        run: npx electron-builder --linux deb
      
      - name: Upload Linux Builds
        uses: actions/upload-artifact@v4
        with:
          name: Filteradium-Linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Filteradium-Windows
          path: ./release-files
      
      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: Filteradium-macOS
          path: ./release-files
      
      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: Filteradium-Linux
          path: ./release-files
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Filteradium ${{ github.ref_name }}"
          body: |
            ## 🎉 Filteradium ${{ github.ref_name }}
            
            ### 📥 Downloads
            
            | Platform | File |
            |----------|------|
            | Windows | `Filteradium-*.exe` (Portable) |
            | macOS | `Filteradium.app` |
            | Linux | `Filteradium-*.AppImage` or `.deb` |
            
            ### 🚀 Quick Start
            
            1. Download the file for your platform
            2. Run the application
            3. Enter your server URL when prompted
            
            ### 📝 Notes
            
            - Windows: No installation needed, just run the .exe
            - macOS: May need to allow in System Preferences > Security
            - Linux: Make AppImage executable with `chmod +x`
          files: |
            ./release-files/*
          draft: false
          prerelease: false
