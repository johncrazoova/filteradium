<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Filteradium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-right">
      <span class="logo">F</span>
      <h1>FILTERADIUM</h1>
      <span class="subtitle">استخراج و صادرات داده بورس</span>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <!-- Stats -->
      <div class="panel stats-panel">
        <h3>📊 آمار دیتابیس</h3>
        <div class="stats-grid">
          <div class="stat"><span class="stat-num" id="statStocks">0</span><span class="stat-label">نماد</span></div>
          <div class="stat"><span class="stat-num" id="statHistory">0</span><span class="stat-label">سابقه قیمت</span></div>
          <div class="stat"><span class="stat-num" id="statClients">0</span><span class="stat-label">حقیقی/حقوقی</span></div>
          <div class="stat"><span class="stat-num" id="statShareholders">0</span><span class="stat-label">سهامداران</span></div>
        </div>
        <button id="btnFetchStocks" class="btn btn-accent full-width" onclick="fetchAllStocks()">
          🔄 دریافت لیست نمادها از TSETMC
        </button>
      </div>

      <!-- Data Type -->
      <div class="panel">
        <h3>📊 نوع داده</h3>
        <div class="radio-group">
          <label class="radio-item active" data-type="price">
            <input type="radio" name="dataType" value="price" checked>
            <span class="radio-icon">📈</span><span>قیمت و حجم</span>
          </label>
          <label class="radio-item" data-type="client">
            <input type="radio" name="dataType" value="client">
            <span class="radio-icon">👥</span><span>حقیقی/حقوقی</span>
          </label>
          <label class="radio-item" data-type="shareholder">
            <input type="radio" name="dataType" value="shareholder">
            <span class="radio-icon">🏢</span><span>سهام‌داران</span>
          </label>
        </div>
      </div>

      <!-- Sector -->
      <div class="panel">
        <h3>🏭 صنعت</h3>
        <select id="sectorFilter" class="select">
          <option value="all">همه صنایع</option>
        </select>
      </div>

      <!-- Date Range -->
      <div class="panel">
        <h3>📅 بازه زمانی</h3>
        <div class="date-range">
          <label>از</label>
          <input type="date" id="startDate" class="input">
          <label>تا</label>
          <input type="date" id="endDate" class="input">
        </div>
        <div class="quick-dates">
          <button class="btn-sm" onclick="setQuickDate(7)">هفته</button>
          <button class="btn-sm" onclick="setQuickDate(30)">ماه</button>
          <button class="btn-sm" onclick="setQuickDate(90)">۳ ماه</button>
          <button class="btn-sm" onclick="setQuickDate(180)">۶ ماه</button>
          <button class="btn-sm" onclick="setQuickDate(365)">سال</button>
        </div>
      </div>

      <!-- Symbols -->
      <div class="panel">
        <h3>🔍 نماد</h3>
        <input type="text" id="symbolSearch" placeholder="جستجو..." class="input">
        <div id="symbolList" class="symbol-list"></div>
      </div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <div class="toolbar-right">
          <button id="btnFetch" class="btn btn-primary" onclick="fetchData()">
            🔄 دریافت و نمایش داده
          </button>
          <span id="recordCount" class="badge">0 رکورد</span>
        </div>
        <div class="toolbar-left">
          <button id="btnCSV" class="btn btn-success" onclick="exportCSV()" disabled>
            📄 CSV
          </button>
          <button id="btnExcel" class="btn btn-success" onclick="exportExcel()" disabled>
            📊 Excel
          </button>
        </div>
      </div>

      <div class="table-container">
        <table id="dataTable" class="data-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state">
          <span class="empty-icon">📊</span>
          <h3>داده‌ای نمایش داده نشده</h3>
          <p>۱. ابتدا لیست نمادها رو دریافت کنید</p>
          <p>۲. نمادهای مورد نظر رو انتخاب کنید</p>
          <p>۳. دکمه دریافت و نمایش داده رو بزنید</p>
        </div>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
