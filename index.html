<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>FILTERADIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A1A;--card:#1A1A2E;--card2:#16213E;--gold:#D4AF37;--gold2:#B8941F;--text:#E8E8E8;--text2:#888;--green:#00C853;--red:#FF1744;--blue:#448AFF;--border:#2A2A3E}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
.header{background:linear-gradient(135deg,#0D0D2B,#1A1A3E);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:3px}
.logo span{color:var(--text);font-size:14px;font-weight:400;margin-right:8px}
.nav{display:flex;gap:4px}
.nav button{background:transparent;border:none;color:var(--text2);padding:10px 16px;cursor:pointer;font-size:13px;border-radius:8px;transition:.2s}
.nav button.active{background:var(--gold);color:#000;font-weight:700}
.nav button:hover{background:var(--card2)}
.tab{display:none;padding:16px;max-width:1200px;margin:0 auto}
.tab.active{display:block}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border);transition:.2s}
.card:hover{border-color:var(--gold)}
.stock-row{display:grid;grid-template-columns:1fr 80px 80px 100px 80px;align-items:center;padding:12px;gap:8px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.stock-row:hover{background:var(--card2)}
.stock-name{font-weight:700;font-size:15px}

  .stock-row{grid-template-columns:1fr 60px 60px 80px 60px;font-size:12px}

  .detail-grid{grid-template-columns:1fr 1fr}
  .nav button{padding:8px 10px;font-size:11px}
}

<script>
// ========== INDICATORS ==========
function sma(data, period) {
  const r = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { r.push(null); continue; }
    let s = 0;
    for (let j = i - period + 1; j <= i; j++) s += data[j];
    r.push(s / period);
  }
  return r;
}

function ema(data, period) {
  const r = [data[0]];
  const k = 2 / (period + 1);
  for (let i = 1; i < data.length; i++) {
    r.push(data[i] * k + r[i - 1] * (1 - k));
  }
  return r;
}

function rsi(closes, period) {
  const r = [];
  let gains = 0, losses = 0;
  for (let i = 0; i < closes.length; i++) {
    if (i === 0) { r.push(null); continue; }
    const diff = closes[i] - closes[i - 1];
    if (i <= period) {
      if (diff > 0) gains += diff; else losses -= diff;
      if (i < period) { r.push(null); continue; }
      const avgG = gains / period;
      const avgL = losses / period;
      r.push(avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL));
      gains = avgG; losses = avgL;
    } else {
      const g = diff > 0 ? diff : 0;
      const l = diff < 0 ? -diff : 0;
      gains = (gains * (period - 1) + g) / period;
      losses = (losses * (period - 1) + l) / period;
      r.push(losses === 0 ? 100 : 100 - 100 / (1 + gains / losses));
    }
  }
  return r;
}

function macd(closes, fast, slow, sig) {
  const emaF = ema(closes, fast);
  const emaS = ema(closes, slow);
  const line = emaF.map((v, i) => v - emaS[i]);
  const signal = ema(line, sig);
  const hist = line.map((v, i) => v - signal[i]);
  return { line, signal, hist };
}

function bollinger(closes, period, mult) {
  const mid = sma(closes, period);
  const upper = [], lower = [];
  for (let i = 0; i < closes.length; i++) {
    if (mid[i] === null) { upper.push(null); lower.push(null); continue; }
    let ss = 0;
    for (let j = i - period + 1; j <= i; j++) ss += (closes[j] - mid[i]) ** 2;
    const std = Math.sqrt(ss / period);
    upper.push(mid[i] + mult * std);
    lower.push(mid[i] - mult * std);
  }
  return { upper, mid, lower };
}

function stochastic(highs, lows, closes, kPeriod, dPeriod) {
  const k = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < kPeriod - 1) { k.push(null); continue; }
    let hh = -Infinity, ll = Infinity;
    for (let j = i - kPeriod + 1; j <= i; j++) { hh = Math.max(hh, highs[j]); ll = Math.min(ll, lows[j]); }
    k.push(hh === ll ? 50 : ((closes[i] - ll) / (hh - ll)) * 100);
  }
  const kClean = k.map(v => v === null ? 0 : v);
  const d = sma(kClean, dPeriod);
  return { k, d };
}

function atr(highs, lows, closes, period) {
  const tr = [highs[0] - lows[0]];
  for (let i = 1; i < closes.length; i++) {
    tr.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
  }
  return sma(tr, period);
}

function adx(highs, lows, closes, period) {
  const pDM = [], nDM = [], tr = [highs[0] - lows[0]];
  pDM.push(0); nDM.push(0);
  for (let i = 1; i < closes.length; i++) {
    const up = highs[i] - highs[i - 1];
    const dn = lows[i - 1] - lows[i];
    pDM.push(up > dn && up > 0 ? up : 0);
    nDM.push(dn > up && dn > 0 ? dn : 0);
    tr.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
  }
  const atr14 = sma(tr, period);
  const smoothedPDM = ema(pDM, period);
  const smoothedNDM = ema(nDM, period);
  const dx = smoothedPDM.map((v, i) => {
    const pdi = atr14[i] ? (v / atr14[i]) * 100 : 0;
    const ndi = atr14[i] ? (smoothedNDM[i] / atr14[i]) * 100 : 0;
    return pdi + ndi === 0 ? 0 : Math.abs(pdi - ndi) / (pdi + ndi) * 100;
  });
  return sma(dx, period);
}

function cci(highs, lows, closes, period) {
  const tp = closes.map((c, i) => (highs[i] + lows[i] + c) / 3);
  const tpSma = sma(tp, period);
  return tp.map((v, i) => {
    if (tpSma[i] === null) return null;
    let md = 0;
    for (let j = i - period + 1; j <= i; j++) md += Math.abs(tp[j] - tpSma[i]);
    md /= period;
    return md === 0 ? 0 : (v - tpSma[i]) / (0.015 * md);
  });
}

function williamsR(highs, lows, closes, period) {
  const r = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < period - 1) { r.push(null); continue; }
    let hh = -Infinity, ll = Infinity;
    for (let j = i - period + 1; j <= i; j++) { hh = Math.max(hh, highs[j]); ll = Math.min(ll, lows[j]); }
    r.push(hh === ll ? -50 : ((hh - closes[i]) / (hh - ll)) * -100);
  }
  return r;
}

function mfi(highs, lows, closes, volumes, period) {
  const tp = closes.map((c, i) => (highs[i] + lows[i] + c) / 3);
  const mf = tp.map((v, i) => v * volumes[i]);
  const r = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < period) { r.push(null); continue; }
    let pmf = 0, nmf = 0;
    for (let j = i - period + 1; j <= i; j++) {
      if (tp[j] > tp[j - 1]) pmf += mf[j]; else nmf += mf[j];
    }
    r.push(nmf === 0 ? 100 : 100 - 100 / (1 + pmf / nmf));
  }
  return r;
}

function obv(closes, volumes) {
  const r = [0];
  for (let i = 1; i < closes.length; i++) {
    r.push(closes[i] > closes[i - 1] ? r[i - 1] + volumes[i] : closes[i] < closes[i - 1] ? r[i - 1] - volumes[i] : r[i - 1]);
  }
  return r;
}

function vwap(highs, lows, closes, volumes) {
  const r = [];
  let cumTP = 0, cumV = 0;
  for (let i = 0; i < closes.length; i++) {
    const tp = (highs[i] + lows[i] + closes[i]) / 3;
    cumTP += tp * volumes[i];
    cumV += volumes[i];
    r.push(cumV === 0 ? closes[i] : cumTP / cumV);
  }
  return r;
}

// ========== SCORING ==========
function calcScores(stock) {
  const { highs, lows, closes, volumes } = stock;
  const n = closes.length - 1;
  const s20 = sma(closes, 20);
  const s50 = sma(closes, 50);
  const s12 = ema(closes, 12);
  const s26 = ema(closes, 26);
  const r = rsi(closes, 14);
  const m = macd(closes, 12, 26, 9);
  const bb = bollinger(closes, 20, 2);
  const st = stochastic(highs, lows, closes, 14, 3);
  const ad = adx(highs, lows, closes, 14);
  const cc = cci(highs, lows, closes, 20);
  const wr = williamsR(highs, lows, closes, 14);
  const mf = mfi(highs, lows, closes, volumes, 14);
  const ob = obv(closes, volumes);
  const vw = vwap(highs, lows, closes, volumes);

  // Technical Score (trend)
  let tech = 50;
  if (s20[n] && s50[n]) {
    if (closes[n] > s20[n]) tech += 10; else tech -= 10;
    if (s20[n] > s50[n]) tech += 10; else tech -= 10;
    if (closes[n] > s50[n]) tech += 5; else tech -= 5;
  }
  if (s12[n] > s26[n]) tech += 10; else tech -= 10;
  if (m.hist[n] > 0) tech += 8; else tech -= 8;
  if (m.hist[n] > m.hist[n - 1]) tech += 5; else tech -= 5;
  if (ad[n] > 25) tech += 7; else tech -= 3;
  tech = Math.max(0, Math.min(100, tech));

  // Momentum Score
  let mom = 50;
  const rsiVal = r[n] || 50;
  mom += (rsiVal - 50) * 0.4;
  if (st.k[n] > st.d[n]) mom += 8; else mom -= 8;
  if (st.k[n] > 80) mom -= 5; else if (st.k[n] < 20) mom += 5;
  if (cc[n] > 100) mom += 5; else if (cc[n] < -100) mom -= 5;
  if (wr[n] > -20) mom -= 3; else if (wr[n] < -80) mom += 3;
  mom = Math.max(0, Math.min(100, mom));

  // Volatility Score
  let vol = 50;
  if (bb.upper[n] && bb.lower[n]) {
    const bw = (bb.upper[n] - bb.lower[n]) / bb.mid[n];
    if (bw < 0.05) vol += 10; else if (bw > 0.15) vol -= 10;
    const bp = (closes[n] - bb.lower[n]) / (bb.upper[n] - bb.lower[n]);
    if (bp < 0.2) vol += 5; else if (bp > 0.8) vol -= 5;
  }
  vol = Math.max(0, Math.min(100, vol));

  // Volume Score
  let vsc = 50;
  const mfiVal = mf[n] || 50;
  vsc += (mfiVal - 50) * 0.3;
  if (ob[n] > ob[n - 1]) vsc += 10; else vsc -= 10;
  if (closes[n] > vw[n]) vsc += 8; else vsc -= 8;
  const avgVol = volumes.slice(-20).reduce((a, b) => a + b, 0) / 20;
  if (volumes[n] > avgVol * 1.5) vsc += 7;
  vsc = Math.max(0, Math.min(100, vsc));

  const total = Math.round(tech * 0.35 + mom * 0.30 + vol * 0.15 + vsc * 0.20);

  let signal;
  if (total > 80) signal = 'خرید قوی';
  else if (total > 60) signal = 'خرید';
  else if (total > 40) signal = 'خنثی';
  else if (total > 20) signal = 'فروش';
  else signal = 'فروش قوی';

  return {
    totalScore: total, technicalScore: Math.round(tech), momentumScore: Math.round(mom),
    volatilityScore: Math.round(vol), volumeScore: Math.round(vsc), signal,
    indicators: { rsi: r[n], macdHist: m.hist[n], adx: ad[n], cci: cc[n], mfi: mfiVal, stochK: st.k[n], williamsR: wr[n], bbPosition: bb.upper[n] ? (closes[n] - bb.lower[n]) / (bb.upper[n] - bb.lower[n]) : 0.5, priceVsSMA20: s20[n] ? closes[n] - s20[n] : 0 }
  };
}

// ========== DEMO DATA ==========
function genStockData(name, code, basePrice, trend) {
  const highs = [], lows = [], closes = [], volumes = [];
  let price = basePrice;
  for (let i = 0; i < 120; i++) {
    const t = trend + (Math.random() - 0.48) * 3;
    const change = t + (Math.random() - 0.5) * 4;
    const open = price;
    price = Math.max(price * 0.7, price + change);
    const high = Math.max(open, price) * (1 + Math.random() * 0.02);
    const low = Math.min(open, price) * (1 - Math.random() * 0.02);
    highs.push(high); lows.push(low); closes.push(price);
    volumes.push(Math.round((500000 + Math.random() * 3000000) * (1 + Math.abs(change) * 0.1)));
  }
  return { name, code, highs, lows, closes, volumes,
    price: closes[closes.length - 1],
    prevPrice: closes[closes.length - 2],
    volume: volumes[volumes.length - 1] };
}

// ========== STATE ==========
let stocks = [];
let filters = [];
let results = [];

function init() {
  const saved = localStorage.getItem('f_stocks');
  if (saved) {
    try { stocks = JSON.parse(saved); } catch(e) { stocks = DEMO_STOCKS; }
  } else {
    stocks = DEMO_STOCKS;
    localStorage.setItem('f_stocks', JSON.stringify(stocks));
  }
  recalcAll();
}

function recalcAll() {
  stocks.forEach(s => {
    const sc = calcScores(s);
    Object.assign(s, sc);
  });
  stocks.sort((a, b) => b.totalScore - a.totalScore);
  localStorage.setItem('f_stocks', JSON.stringify(stocks));
  renderMarket();
  toast('بروزرسانی شد ✓');
}

function renderMarket() {
  const q = document.getElementById('searchInput').value;
  const sort = document.getElementById('sortSelect').value;
  let list = [...stocks];
  if (q) list = list.filter(s => s.name.includes(q) || s.code.includes(q));

  if (sort === 'score-desc') list.sort((a, b) => b.totalScore - a.totalScore);
  else if (sort === 'score-asc') list.sort((a, b) => a.totalScore - b.totalScore);
  else if (sort === 'change-desc') list.sort((a, b) => (b.price - b.prevPrice) / b.prevPrice - (a.price - a.prevPrice) / a.prevPrice);
  else if (sort === 'change-asc') list.sort((a, b) => (a.price - a.prevPrice) / a.prevPrice - (b.price - b.prevPrice) / b.prevPrice);
  else if (sort === 'volume-desc') list.sort((a, b) => b.volume - a.volume);
  else if (sort === 'name-asc') list.sort((a, b) => a.name.localeCompare(b.name, 'fa'));

  const el = document.getElementById('marketList');
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">📊</div>سهمی یافت نشد</div>'; return; }

  el.innerHTML = list.map(s => {
    const chg = ((s.price - s.prevPrice) / s.prevPrice * 100).toFixed(1);
    const cls = chg >= 0 ? 'up' : 'down';
    const sCls = s.totalScore > 80 ? 'score-sb' : s.totalScore > 60 ? 'score-b' : s.totalScore > 40 ? 'score-n' : s.totalScore > 20 ? 'score-s' : 'score-ss';
    return `<div class="card" onclick="showDetail('${s.code}')" style="cursor:pointer">
      <div class="stock-row">
        <div><div class="stock-name">${s.name}</div><div style="font-size:11px;color:var(--text2)">${s.code}</div></div>
        <div class="stock-price">${fmt(s.price)}</div>
        <div class="stock-change ${cls}">${chg > 0 ? '+' : ''}${chg}%</div>
        <div style="text-align:center"><div class="score-badge ${sCls}">${s.totalScore}</div><div class="signal ${cls}">${s.signal}</div></div>
        <div class="stock-price" style="font-size:11px;color:var(--text2)">${fmtVol(s.volume)}</div>
      </div>
    </div>`;
  }).join('');
}

function showDetail(code) {
  const s = stocks.find(x => x.code === code);
  if (!s) return;
  const chg = ((s.price - s.prevPrice) / s.prevPrice * 100).toFixed(1);
  const cls = chg >= 0 ? 'up' : 'down';
  const ind = s.indicators || {};
  document.getElementById('modalContent').innerHTML = `
    <h3>${s.name} (${s.code})</h3>
    <div style="text-align:center;margin:12px 0">
      <div style="font-size:28px;font-weight:900">${fmt(s.price)}</div>
      <div class="${cls}" style="font-size:16px;font-weight:700">${chg > 0 ? '+' : ''}${chg}%</div>
      <div style="margin-top:8px"><span class="score-badge ${s.totalScore > 80 ? 'score-sb' : s.totalScore > 60 ? 'score-b' : s.totalScore > 40 ? 'score-n' : 'score-s'}" style="width:56px;height:56px;font-size:18px">${s.totalScore}</span></div>
      <div style="margin-top:4px;font-weight:700;color:var(--gold)">${s.signal}</div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="lbl">تکنیکال</div><div class="val">${s.technicalScore}</div><div class="bar"><div class="bar-fill" style="width:${s.technicalScore}%;background:var(--gold)"></div></div></div>
      <div class="detail-item"><div class="lbl">مومنتوم</div><div class="val">${s.momentumScore}</div><div class="bar"><div class="bar-fill" style="width:${s.momentumScore}%;background:var(--blue)"></div></div></div>
      <div class="detail-item"><div class="lbl">نوسان</div><div class="val">${s.volatilityScore}</div><div class="bar"><div class="bar-fill" style="width:${s.volatilityScore}%;background:var(--green)"></div></div></div>
      <div class="detail-item"><div class="lbl">حجم</div><div class="val">${s.volumeScore}</div><div class="bar"><div class="bar-fill" style="width:${s.volumeScore}%;background:var(--red)"></div></div></div>
    </div>
    <h3 style="color:var(--gold);margin:16px 0 8px">اندیکاتورها</h3>
    <div class="stat-row"><span class="stat-label">RSI</span><span class="stat-val">${num(ind.rsi)}</span></div>
    <div class="stat-row"><span class="stat-label">MACD هیستوگرام</span><span class="stat-val">${num(ind.macdHist)}</span></div>
    <div class="stat-row"><span class="stat-label">ADX</span><span class="stat-val">${num(ind.adx)}</span></div>
    <div class="stat-row"><span class="stat-label">CCI</span><span class="stat-val">${num(ind.cci)}</span></div>
    <div class="stat-row"><span class="stat-label">MFI</span><span class="stat-val">${num(ind.mfi)}</span></div>
    <div class="stat-row"><span class="stat-label">استوکاستیک K</span><span class="stat-val">${num(ind.stochK)}</span></div>
    <div class="stat-row"><span class="stat-label">Williams %R</span><span class="stat-val">${num(ind.williamsR)}</span></div>
    <div class="stat-row"><span class="stat-label">موقعیت بولینگر</span><span class="stat-val">${num(ind.bbPosition, 2)}</span></div>
    <div class="stat-row"><span class="stat-label">حجم</span><span class="stat-val">${fmtVol(s.volume)}</span></div>
    <button class="btn" onclick="closeModal()" style="width:100%;margin-top:16px">بستن</button>`;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ========== FILTERS ==========
function addFilter() {
  const ind = document.getElementById('fIndicator').value;
  const op = document.getElementById('fOperator').value;
  const val = parseFloat(document.getElementById('fValue').value);
  if (isNaN(val)) { toast('مقدار را وارد کنید'); return; }
  filters.push({ indicator: ind, operator: op, value: val });
  renderFilterChips();
}

function removeFilter(i) { filters.splice(i, 1); renderFilterChips(); }
function clearFilters() { filters = []; renderFilterChips(); }

function renderFilterChips() {
  const names = { totalScore:'امتیاز کل', technicalScore:'تکنیکال', momentumScore:'مومنتوم', volatilityScore:'نوسان', volumeScore:'حجم', rsi:'RSI', macdHist:'MACD', adx:'ADX', cci:'CCI', mfi:'MFI', stochK:'استوکاستیک', williamsR:'Williams %R', bbPosition:'بولینگر', priceVsSMA20:'قیمت vs SMA20' };
  const ops = { gt:'>', lt:'<', gte:'≥', lte:'≤', eq:'=' };
  document.getElementById('filterChips').innerHTML = filters.length ? filters.map((f, i) =>
    `<div class="filter-chip active">${names[f.indicator] || f.indicator} ${ops[f.operator]} ${f.value} <span class="x" onclick="removeFilter(${i})">✕</span></div>`
  ).join('') : '<span style="color:var(--text2);font-size:13px">شرطی اضافه نشده</span>';
}

function runFilters() {
  if (!filters.length) { toast('اول شرط اضافه کنید'); return; }
  results = stocks.filter(s => {
    return filters.every(f => {
      let val;
      if (['rsi','macdHist','adx','cci','mfi','stochK','williamsR','bbPosition','priceVsSMA20'].includes(f.indicator)) {
        val = (s.indicators || {})[f.indicator] || 0;
      } else { val = s[f.indicator] || 0; }
      switch (f.operator) {
        case 'gt': return val > f.value;
        case 'lt': return val < f.value;
        case 'gte': return val >= f.value;
        case 'lte': return val <= f.value;
        case 'eq': return val === f.value;
      }
    });
  });
  renderResults();
  showTab('results');
  toast(`${results.length} سهم یافت شد ✓`);
}

function renderResults() {
  const el = document.getElementById('resultsContent');
  if (!results.length) { el.innerHTML = '<div class="empty"><div class="icon">🔍</div>نتیجه‌ای نیست. فیلتر اجرا کنید.</div>'; return; }
  el.innerHTML = `<div class="card"><h3 style="color:var(--gold);margin-bottom:8px">📊 نتایج فیلتر (${results.length} سهم)</h3></div>` +
    results.map(s => {
      const chg = ((s.price - s.prevPrice) / s.prevPrice * 100).toFixed(1);
      const cls = chg >= 0 ? 'up' : 'down';
      const sCls = s.totalScore > 80 ? 'score-sb' : s.totalScore > 60 ? 'score-b' : s.totalScore > 40 ? 'score-n' : 'score-s' : 'score-ss';
      return `<div class="card" onclick="showDetail('${s.code}')" style="cursor:pointer">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div><div class="stock-name">${s.name}</div><div class="${cls}" style="font-size:13px">${fmt(s.price)} (${chg > 0 ? '+' : ''}${chg}%)</div></div>
          <div style="text-align:center"><div class="score-badge ${sCls}">${s.totalScore}</div><div class="signal">${s.signal}</div></div>
        </div></div>`;
    }).join('');
}

// ========== PRESETS ==========
function presetOversold() { clearFilters(); filters.push({ indicator:'rsi', operator:'lt', value:30 }); renderFilterChips(); runFilters(); }
function presetOverbought() { clearFilters(); filters.push({ indicator:'rsi', operator:'gt', value:70 }); renderFilterChips(); runFilters(); }
function presetStrongTrend() { clearFilters(); filters.push({ indicator:'adx', operator:'gt', value:25 }, { indicator:'technicalScore', operator:'gt', value:60 }); renderFilterChips(); runFilters(); }
function presetBullish() { clearFilters(); filters.push({ indicator:'totalScore', operator:'gt', value:60 }, { indicator:'rsi', operator:'gt', value:50 }); renderFilterChips(); runFilters(); }
function presetVolumeSurge() { clearFilters(); filters.push({ indicator:'volumeScore', operator:'gt', value:60 }); renderFilterChips(); runFilters(); }
function presetGoodScore() { clearFilters(); filters.push({ indicator:'totalScore', operator:'gt', value:70 }); renderFilterChips(); runFilters(); }

// ========== TABS ==========
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => { if (b.textContent.includes({market:'بازار',screener:'فیلتر',results:'نتایج',settings:'تنظیمات'}[name])) b.classList.add('active'); });
}

// ========== SETTINGS ==========
function saveSettings() {
  toast('تنظیمات ذخیره شد ✓');
  recalcAll();
}

// ========== IO ==========
function exportCSV() {
  let csv = 'Name,Code,Price,Change%,TotalScore,Technical,Momentum,Volatility,VolumeScore,Signal\n';
  stocks.forEach(s => {
    const chg = ((s.price - s.prevPrice) / s.prevPrice * 100).toFixed(2);
    csv += `${s.name},${s.code},${s.price.toFixed(0)},${chg},${s.totalScore},${s.technicalScore},${s.momentumScore},${s.volatilityScore},${s.volumeScore},${s.signal}\n`;
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'filteradium_export.csv';
  a.click();
  toast('خروجی CSV ✓');
}

function importCSV(e) {
  toast('ورودی CSV پشتیبانی نمی‌شود (فقط خروجی)');
}

// ========== UTILS ==========
function fmt(n) { return n ? n.toLocaleString('fa-IR') : '0'; }
function fmtVol(n) { return n > 1e6 ? (n / 1e6).toFixed(1) + 'M' : n > 1e3 ? (n / 1e3).toFixed(0) + 'K' : n; }
function num(v, d) { return v !== null && v !== undefined ? Number(v).toFixed(d || 1) : '-'; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

// Init
init();
</script>
